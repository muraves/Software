[project]

name = "muraves-lib"   # nome del package (a tua scelta)
version = "0.1.0"  # muraves_lib-vX.Y.Z git tag
description = "Project for analysis and monitoring of MuRaVes data"
readme = "README.md"
requires-python = ">=3.8"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["muraves_lib", "muraves_lib.reco"]   # i pacchetti che vuoi includere

[tool.setuptools.package-data]
# Detector and reconstruction configuration (muraves_lib/configuration/), shipped with the package.
"muraves_lib" = [
    "configuration/*.md",
    "configuration/*/*.json",
    "configuration/*/*.md",
    "configuration/data/*/*.cfg",
    "configuration/data/*/*.md",
    "configuration/data/pedestal_1phe_values/*/*.txt",
]

